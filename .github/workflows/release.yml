name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt pyinstaller
      - run: python -m pytest -q
      - run: python -m PyInstaller --noconfirm --onefile --noconsole --name MeuSoundpad --collect-all tkinterdnd2 --collect-all customtkinter soundpad.py
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/MeuSoundpad.exe
